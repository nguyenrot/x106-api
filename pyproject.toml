[project]
name = "x106-api"
version = "0.1.0"
description = "X106 API — Django + DRF backend for the X106 ecosystem"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.7",
    "django-environ>=0.12",
    "drf-spectacular>=0.28",
    "celery[redis]>=5.5",
    "redis>=5.2",
    "mysqlclient>=2.2",
    "bcrypt>=4.2",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "x106.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "-x --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501"]
