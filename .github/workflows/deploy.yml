name: Deploy API to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: test_x106
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync dependencies
        run: |
          source $HOME/.local/bin/env
          uv sync --frozen

      - name: Run pytest
        env:
          DJANGO_SETTINGS_MODULE: x106.settings.dev
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: test_x106
          DB_USER: root
          DB_PASSWORD: rootpw
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET: ci-test-secret
        run: |
          source $HOME/.local/bin/env
          uv run pytest -x

      - name: Collect static
        env:
          DJANGO_SETTINGS_MODULE: x106.settings.production
          DJANGO_SECRET_KEY: collectstatic-only
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: test_x106
          DB_USER: root
          DB_PASSWORD: rootpw
        run: |
          source $HOME/.local/bin/env
          uv run python manage.py collectstatic --noinput

      - name: Package source
        run: |
          tar czf api-deploy.tar.gz \
            pyproject.toml uv.lock manage.py deploy.sh \
            x106 apps staticfiles
          ls -lh api-deploy.tar.gz

      - name: SCP to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: api-deploy.tar.gz
          target: /tmp/

      - name: Extract + restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR=/var/www/api
            API_SERVICE=x106-api
            CELERY_SERVICE=x106-celery-worker
            BEAT_SERVICE=x106-celery-beat

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Snapshot the previous source tree once per deploy.
            rm -rf .prev
            mkdir -p .prev
            for d in x106 apps staticfiles; do
              [ -e "$d" ] && mv "$d" ".prev/$d" || true
            done
            for f in pyproject.toml uv.lock manage.py deploy.sh; do
              [ -e "$f" ] && cp -f "$f" ".prev/$f" || true
            done

            tar xzf /tmp/api-deploy.tar.gz
            rm /tmp/api-deploy.tar.gz

            export PATH="$HOME/.local/bin:$PATH"
            uv sync --frozen
            uv run python manage.py migrate --noinput

            systemctl restart "$API_SERVICE"
            sleep 2
            systemctl is-active --quiet "$API_SERVICE"
            curl -fsSL https://api.pkn.io.vn/api/v1/health -o /dev/null -w 'health HTTP %{http_code}\n'

            for svc in "$CELERY_SERVICE" "$BEAT_SERVICE"; do
              if [ -f "/etc/systemd/system/${svc}.service" ]; then
                systemctl restart "$svc"
                sleep 1
                systemctl is-active --quiet "$svc"
                echo "[api] $svc restarted"
              else
                echo "[api] WARNING: ${svc}.service not installed"
              fi
            done
