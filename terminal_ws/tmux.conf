# tmux cho admin Terminal — server riêng (x106-tmux.service, socket
# /run/x106-console/tmux.sock), không dính tmux cá nhân của root.
#
# Mục tiêu: tmux "vô hình". Nó chỉ giữ shell sống qua reload / rớt mạng /
# deploy; tab, scrollback, tìm kiếm, copy-paste đều do xterm.js lo. Chỉ được
# đọc lúc server khởi động — sửa xong phải `systemctl restart x106-tmux`
# (giết mọi phiên) hoặc `tmux -S /run/x106-console/tmux.sock source <file>`.

# Không prefix: Ctrl-b đi thẳng vào shell, tmux lồng bên trong vẫn dùng bình thường.
set -g prefix None
set -g prefix2 None

# Không status bar — UI tự vẽ tab phiên.
set -g status off

# Esc không bị trễ (vim, fzf).
set -s escape-time 0

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:clipboard"

# Vẽ lên màn hình chính thay vì alternate screen → dòng cuộn qua mép trên rơi
# vào scrollback của xterm.js (cuộn chuột + Ctrl+Shift+F vẫn chạy).
set -as terminal-overrides ",xterm-256color:smcup@:rmcup@"

# OSC 52: vim/tmux lồng copy thẳng ra clipboard trình duyệt.
set -s set-clipboard on

# Chuột để xterm.js lo (bôi đen + cuộn native). Bật lên thì cuộn chuột sẽ rơi
# vào copy-mode của tmux.
set -g mouse off

set -g history-limit 50000
set -g focus-events on

# Hai cửa sổ trình duyệt cùng mở một phiên → cỡ theo cửa sổ gõ gần nhất.
set -g window-size latest
